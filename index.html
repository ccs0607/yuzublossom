<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050916">
  <title>月满人间 · 中秋贺卡</title>
  <meta name="description" content="一张会苏醒的中秋互动贺卡：星河、明月、嫦娥、桂花、天灯与祝福。">
  <link rel="preload" href="assets/generated/final_scene.webp" as="image">
  <link rel="preload" href="assets/generated/moon.webp" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <main id="app" class="phase-stars">
    <section id="scene" class="scene" aria-label="中秋互动场景">
      <div class="sky"></div>
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>

      <div id="moonWrap" class="moon-wrap interactive-moon" role="button" aria-label="轻触明月" tabindex="0">
        <div class="moon-halo moon-halo-a"></div>
        <div class="moon-halo moon-halo-b"></div>
        <img src="assets/generated/moon.webp" class="moon" alt="明月">
      </div>

      <img src="assets/generated/clouds_far.webp" class="cloud cloud-far" alt="">
      <img src="assets/generated/clouds_near.webp" class="cloud cloud-near" alt="">

      <img src="assets/generated/chang_e_silhouette.webp" class="chang-e-silhouette" alt="嫦娥轮廓">
      <div class="final-scene-wrap">
        <img src="assets/generated/final_scene.webp" class="final-scene" alt="月下嫦娥与中秋夜景">
      </div>
      <div class="left-veil"></div>

      <img src="assets/generated/ribbons.webp" class="ribbons" alt="">
      <img src="assets/generated/petals.webp" class="petal-art petal-art-a" alt="">
      <img src="assets/generated/petals.webp" class="petal-art petal-art-b" alt="">

      <section class="title-stage" aria-label="中秋祝福">
        <p class="eyebrow">八月十五 · 月满人间</p>
        <div class="title-reveal">
          <img src="assets/generated/title.webp" class="title-art" alt="中秋">
        </div>
        <p class="blessing">但愿人长久，千里共婵娟</p>
      </section>

      <div id="narration" class="narration">今夜，从一片安静的黑开始。</div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">月</span>
          <span>月满人间<small>MID-AUTUMN NIGHT</small></span>
        </div>
        <div class="top-actions">
          <button id="soundBtn" class="glass-btn" aria-pressed="false">♫ 氛围</button>
          <button id="skipBtn" class="glass-btn">跳过开场</button>
          <button id="replayBtn" class="glass-btn hidden">重播</button>
        </div>
      </header>

      <aside id="wishPanel" class="wish-panel">
        <div class="wish-heading">
          <div><span class="wish-kicker">MOONLIGHT WISH</span><h2>月下祈愿</h2></div>
          <button id="collapseBtn" class="icon-btn" aria-label="收起祈愿面板">⌄</button>
        </div>
        <p>写下一句心愿，让它顺着月光缓缓升起。</p>
        <div class="wish-row">
          <input id="wishInput" maxlength="18" autocomplete="off" placeholder="愿所念之人，岁岁平安">
          <button id="wishBtn" class="gold-btn">放飞天灯</button>
        </div>
        <div class="modes" aria-label="月夜氛围">
          <button data-mode="moon" class="mode active"><i>✦</i>澄月</button>
          <button data-mode="osmanthus" class="mode"><i>❀</i>桂雨</button>
          <button data-mode="lantern" class="mode"><i>◇</i>灯海</button>
          <button id="touchMoonBtn" class="mode"><i>☾</i>触月</button>
        </div>
      </aside>

      <button id="wishChip" class="wish-chip hidden">✦ 写下心愿</button>
      <div id="tip" class="tip">轻点夜空，星河会回应你</div>
      <div id="lanternField" class="lantern-field" aria-hidden="true"></div>
      <div id="petalField" class="petal-field" aria-hidden="true"></div>
      <div id="toast" class="toast"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
