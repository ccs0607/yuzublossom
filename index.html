<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月满人间 · 中秋贺卡</title><meta name="theme-color" content="#050816"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="fx"></canvas>
<main id="app" class="p-stars">
  <section id="scene">
    <div class="sky"></div><div class="aurora"></div>
    <div id="moonLayer" class="img-layer moon-layer"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div id="silLayer" class="img-layer sil-layer"></div>
    <div id="charLayer" class="img-layer char-layer"></div>
    <div id="finalLayer" class="img-layer final-layer"></div>
    <div id="titleShade" class="title-shade"></div>
    <div class="ribbon r1"></div><div class="ribbon r2"></div><div class="ribbon r3"></div>
    <div id="petals" class="petals"></div>
    <div class="mist"></div>
    <div id="narration" class="narration">今夜，从一片安静的黑开始。</div>
    <div class="toolbar"><button id="skipBtn">跳过开场</button><button id="replayBtn" class="hidden">重播动画</button></div>
    <section id="panel" class="panel"><div class="panel-card"><div><b>月下祈愿</b><small>写下一句心愿，让它顺着月光升起。</small></div><div class="wish"><input id="wishInput" maxlength="18" placeholder="愿所念之人，岁岁平安"><button id="wishBtn">放飞天灯</button></div><div class="panel-foot"><button id="moonBtn">轻触明月</button><span>也可以直接点击夜空</span></div></div></section>
    <div id="lanterns" class="lanterns"></div><div id="tip" class="tip">轻点夜空，星河会回应你</div>
  </section>
</main><script src="app.js"></script></body></html>
